name: Generate Profile SVGs

on:
  # Executa a cada 12 horas
  schedule:
    - cron: '0 */12 * * *'
  
  # Executa quando config.yml ou arquivos do generator mudarem
  push:
    branches:
      - main
    paths:
      - 'config.yml'
      - 'generator/**'
      - '.github/workflows/generate-profile.yml'
  
  # Permite execução manual
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Generate SVGs (Demo Mode)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m generator.main
      
      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add assets/generated/*.svg
          
          # Verifica se há mudanças
          if git diff --staged --quiet; then
            echo "Nenhuma mudança nos SVGs"
          else
            git commit -m "chore: atualiza SVGs do perfil [skip ci]"
            git push
            echo "SVGs atualizados com sucesso!"
          fi
