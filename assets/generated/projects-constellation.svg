<svg xmlns="http://www.w3.org/2000/svg" width="850" height="220" viewBox="0 0 850 220">
  <rect width="850" height="220" fill="#0f1420" rx="10"/>
  
  <rect x="2" y="2" width="846" height="216" 
        fill="none" stroke="#ffb800" stroke-width="1" 
        opacity="0.3" rx="10"/>
  
  <text x="425" y="30" text-anchor="middle" 
        font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" 
        fill="#e0e6f7">
    ⭐ Featured Systems
  </text>
  
  <g transform="translate(62.5, 60)">
    <rect width="250" height="130" 
          fill="#1a1f35" stroke="#00d9ff" 
          stroke-width="2" opacity="0.8" rx="8"/>
    
    <g transform="translate(125, 25)">
      <circle cx="0" cy="0" r="15" fill="none" stroke="#00d9ff" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" 
                          from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle cx="15" cy="0" r="4" fill="#00d9ff">
        <animateTransform attributeName="transform" type="rotate" 
                          from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <text x="125" y="70" text-anchor="middle" 
          font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" 
          fill="#e0e6f7">
      github-readme-sta
    </text>
    
    <text x="125" y="95" text-anchor="middle" 
          font-family="'Segoe UI', Arial, sans-serif" font-size="11" 
          fill="#8892b0">
      Estatísticas dinâmicas do GitHub
    </text>
    
    <text x="125" y="115" text-anchor="middle" 
          font-family="'Segoe UI', Arial, sans-serif" font-size="10" 
          fill="#00d9ff">
      EuHttl/github-readme-stats
    </text>
  </g>

  <g transform="translate(300, 60)">
    <rect width="250" height="130" 
          fill="#1a1f35" stroke="#a970ff" 
          stroke-width="2" opacity="0.8" rx="8"/>
    
    <g transform="translate(125, 25)">
      <circle cx="0" cy="0" r="15" fill="none" stroke="#a970ff" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" 
                          from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle cx="15" cy="0" r="4" fill="#a970ff">
        <animateTransform attributeName="transform" type="rotate" 
                          from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <text x="125" y="70" text-anchor="middle" 
          font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" 
          fill="#e0e6f7">
      convoychat
    </text>
    
    <text x="125" y="95" text-anchor="middle" 
          font-family="'Segoe UI', Arial, sans-serif" font-size="11" 
          fill="#8892b0">
