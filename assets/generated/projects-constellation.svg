    </text>
  </g>

  <g transform="translate(537.5, 60)">
    <rect width="250" height="130" 
          fill="#1a1f35" stroke="#ffb800" 
          stroke-width="2" opacity="0.8" rx="8"/>
    
    <g transform="translate(125, 25)">
      <circle cx="0" cy="0" r="15" fill="none" stroke="#ffb800" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" 
                          from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle cx="15" cy="0" r="4" fill="#ffb800">
        <animateTransform attributeName="transform" type="rotate" 
                          from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <text x="125" y="70" text-anchor="middle" 
          font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" 
          fill="#e0e6f7">
