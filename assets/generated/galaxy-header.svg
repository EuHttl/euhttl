<svg xmlns="http://www.w3.org/2000/svg" width="850" height="300" viewBox="0 0 850 300">
  <defs>
    <radialGradient id="centerGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#a970ff;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#0a0e27;stop-opacity:0" />
    </radialGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="850" height="300" fill="#0a0e27"/>
  
  <!-- Starfield -->
  <g opacity="0.5">
    <circle cx="50" cy="30" r="1" fill="#ffffff" opacity="0.8"/>
    <circle cx="150" cy="50" r="0.8" fill="#ffffff" opacity="0.6"/>
    <circle cx="250" cy="40" r="1.2" fill="#ffffff" opacity="0.9"/>
    <circle cx="350" cy="60" r="0.7" fill="#ffffff" opacity="0.5"/>
    <circle cx="450" cy="35" r="1" fill="#ffffff" opacity="0.7"/>
    <circle cx="550" cy="55" r="1.1" fill="#ffffff" opacity="0.8"/>
    <circle cx="650" cy="45" r="0.9" fill="#ffffff" opacity="0.6"/>
    <circle cx="750" cy="38" r="1.2" fill="#ffffff" opacity="0.9"/>
    <circle cx="800" cy="250" r="1" fill="#ffffff" opacity="0.7"/>
    <circle cx="100" cy="260" r="0.8" fill="#ffffff" opacity="0.6"/>
    <circle cx="200" cy="270" r="1.1" fill="#ffffff" opacity="0.8"/>
    <circle cx="700" cy="255" r="1" fill="#ffffff" opacity="0.7"/>
  </g>
  
  <!-- Órbitas -->
  <g opacity="0.8">
    <ellipse cx="425" cy="150" rx="80" ry="48" 
             stroke="#1a1f35" stroke-width="1" 
             fill="none" opacity="0.3"/>
    <ellipse cx="425" cy="150" rx="130" ry="78" 
             stroke="#1a1f35" stroke-width="1" 
             fill="none" opacity="0.3"/>
    <ellipse cx="425" cy="150" rx="180" ry="108" 
             stroke="#1a1f35" stroke-width="1" 
             fill="none" opacity="0.3"/>
  </g>
  
  <!-- Centro com inicial -->
  <g filter="url(#glow)">
    <circle cx="425" cy="150" r="35" fill="url(#centerGlow)" opacity="0.6">
      <animate attributeName="r" values="35;38;35" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="425" cy="150" r="30" stroke="#00d9ff" 
            stroke-width="2" fill="#0a0e27" opacity="0.9"/>
    <text x="425" y="162" text-anchor="middle" 
          font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="bold" 
          fill="#00d9ff">
      H
    </text>
  </g>
  
  <!-- Tecnologias orbitando -->
  <g>
    <!-- Órbita 1 -->
    <g>
      <circle cx="425" cy="102" r="4" fill="#00d9ff" opacity="0.8">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="425" y="92" text-anchor="middle" 
            font-family="'Courier New', monospace" font-size="11" 
            fill="#00d9ff" opacity="0.9">
        Java
      </text>
    </g>
    
    <g>
      <circle cx="505" cy="150" r="4" fill="#00d9ff" opacity="0.8">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="505" y="140" text-anchor="middle" 
            font-family="'Courier New', monospace" font-size="11" 
            fill="#00d9ff" opacity="0.9">
        Spring Boot
      </text>
    </g>
    
    <g>
      <circle cx="425" cy="198" r="4" fill="#00d9ff" opacity="0.8">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="425" y="218" text-anchor="middle" 
            font-family="'Courier New', monospace" font-size="11" 
            fill="#00d9ff" opacity="0.9">
        Node.js
      </text>
    </g>
    
    <g>
      <circle cx="345" cy="150" r="4" fill="#00d9ff" opacity="0.8">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="345" y="140" text-anchor="middle" 
            font-family="'Courier New', monospace" font-size="11" 
            fill="#00d9ff" opacity="0.9">
        Docker
      </text>
    </g>
    
    <!-- Órbita 2 -->
    <g>
      <circle cx="510" cy="110" r="4" fill="#a970ff" opacity="0.8">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="510" y="100" text-anchor="middle" 
            font-family="'Courier New', monospace" font-size="11" 
            fill="#a970ff" opacity="0.9">
        React
      </text>
    </g>
    
    <g>
      <circle cx="555" cy="150" r="4" fill="#a970ff" opacity="0.8">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="555" y="140" text-anchor="middle" 
            font-family="'Courier New', monospace" font-size="11" 
            fill="#a970ff" opacity="0.9">
        TypeScript
      </text>
    </g>
    
    <g>
      <circle cx="510" cy="190" r="4" fill="#a970ff" opacity="0.8">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="510" y="210" text-anchor="middle" 
            font-family="'Courier New', monospace" font-size="11" 
            fill="#a970ff" opacity="0.9">
        Next.js
      </text>
    </g>
    
    <g>
      <circle cx="340" cy="110" r="4" fill="#a970ff" opacity="0.8">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="340" y="100" text-anchor="middle" 
            font-family="'Courier New', monospace" font-size="11" 
            fill="#a970ff" opacity="0.9">
        Tailwind
      </text>
    </g>
    
    <!-- Órbita 3 -->
    <g>
      <circle cx="605" cy="150" r="4" fill="#ffb800" opacity="0.8">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="605" y="140" text-anchor="middle" 
            font-family="'Courier New', monospace" font-size="11" 
            fill="#ffb800" opacity="0.9">
        PostgreSQL
      </text>
    </g>
    
    <g>
      <circle cx="560" cy="210" r="4" fill="#ffb800" opacity="0.8">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="560" y="230" text-anchor="middle" 
            font-family="'Courier New', monospace" font-size="11" 
            fill="#ffb800" opacity="0.9">
        MySQL
      </text>
    </g>
    
    <g>
      <circle cx="290" cy="210" r="4" fill="#ffb800" opacity="0.8">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="290" y="230" text-anchor="middle" 
            font-family="'Courier New', monospace" font-size="11" 
            fill="#ffb800" opacity="0.9">
        Git
      </text>
    </g>
  </g>
  
  <!-- Nome -->
  <text x="425" y="45" text-anchor="middle" 
        font-family="'Segoe UI', Arial, sans-serif" font-size="38" font-weight="700" 
        fill="#e0e6f7">
    Hyttalo Costa
  </text>
  
  <!-- Subtítulo -->
  <text x="425" y="72" text-anchor="middle" 
        font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400"
        fill="#8892b0">
    Desenvolvedor Fullstack | Backend em foco
  </text>
  
  <!-- Filosofia -->
  <text x="425" y="285" text-anchor="middle" 
        font-family="'Segoe UI', Arial, sans-serif" font-size="14" 
        font-style="italic" fill="#8892b0" opacity="0.8">
    Let's build something amazing together!
  </text>
</svg>